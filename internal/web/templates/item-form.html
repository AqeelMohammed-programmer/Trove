{{define "content"}}
<h1>{{.Form.Heading}}</h1>

<form method="post" action="{{.Form.Action}}" class="form item-form">
  <input type="hidden" name="csrf" value="{{.CSRF}}">

  <div class="field">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" maxlength="300" value="{{.Form.TitleValue}}" autofocus>
    <p class="hint">Required unless the item has an attachment.</p>
  </div>

  <div class="field">
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="3" maxlength="5000">{{.Form.DescValue}}</textarea>
    <p class="hint">Optional short summary.</p>
  </div>

  <div class="field">
    <label for="note">Note</label>
    <textarea id="note" name="note" rows="12" maxlength="500000">{{.Form.NoteValue}}</textarea>
    <p class="hint">Markdown is supported. Raw HTML is shown as text.</p>
  </div>

  <div class="field">
    <label for="tags">Tags</label>
    <input id="tags" name="tags" type="text" value="{{.Form.TagsValue}}" list="tag-options"
           autocomplete="off" aria-describedby="tags-hint">
    <datalist id="tag-options">
      {{range .Form.AllTags}}<option value="{{.Name}}"></option>{{end}}
    </datalist>
    <p class="hint" id="tags-hint">Separate tags with commas.</p>
  </div>

  <div class="field">
    <label class="check"><input type="checkbox" name="favorite" value="1" {{if .Form.Favorite}}checked{{end}}> Favorite</label>
  </div>

  <div class="form-actions">
    <button type="submit" class="primary">{{.Form.SubmitLabel}}</button>
    <a class="secondary as-button" href="{{.Form.CancelURL}}">Cancel</a>
  </div>
</form>
{{end}}
