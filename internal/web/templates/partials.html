{{define "favorite-form"}}
<form method="post" action="/items/{{.ID}}/favorite" class="favorite-form"
      hx-post="/items/{{.ID}}/favorite" hx-target="this" hx-swap="outerHTML">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="favorite" value="{{if .Favorite}}0{{else}}1{{end}}">
  <input type="hidden" name="next" value="{{.Next}}">
  <button type="submit" class="star{{if .Favorite}} is-favorite{{end}}"
          aria-pressed="{{.Favorite}}"
          aria-label="{{if .Favorite}}Remove from favorites{{else}}Add to favorites{{end}}"
          title="{{if .Favorite}}Remove from favorites{{else}}Add to favorites{{end}}">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"
         {{if .Favorite}}fill="currentColor"{{else}}fill="none" stroke="currentColor" stroke-width="2"{{end}}>
      <path d="m12 3 2.6 5.6 6.1.7-4.5 4.1 1.2 6L12 16.9 6.6 19.4l1.2-6L3.3 9.3l6.1-.7z"/>
    </svg>
  </button>
</form>
{{end}}

{{define "item-tags"}}
{{if .}}<ul class="chips">
  {{range .}}<li><a class="chip" href="{{.URL}}">{{.Name}}</a></li>{{end}}
</ul>{{end}}
{{end}}

{{define "link-row"}}
<div class="link-row">
  <div class="field">
    <label>Link URL</label>
    <input type="url" name="link_url" placeholder="https://example.org" inputmode="url">
  </div>
  <div class="field">
    <label>Label (optional)</label>
    <input type="text" name="link_label" maxlength="100" placeholder="slides">
  </div>
</div>
{{end}}
