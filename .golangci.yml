# golangci-lint configuration (v2 format).
#
# The linters required by AGENTS.md section 5 are enabled explicitly.
# errcheck, govet, ineffassign, staticcheck and unused are part of the
# "standard" set and stay on.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - revive
    - rowserrcheck
    - sqlclosecheck
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: exported
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    paths:
      - .tools

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
